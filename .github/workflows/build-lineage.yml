name: Build LineageOS 23 for Find X3

on:
  workflow_dispatch: {}
  push:
    branches: [lineage-23.0]
    paths: ['.github/workflows/build-lineage.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* mysql* php* 2>/dev/null || true
          sudo apt-get -y autoremove --purge 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h / | tail -1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get -y install git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python-is-python3 bc bison ccache liblz4-tool libncurses-dev \
            libsdl2-dev libssl-dev libwxgtk3.2-dev lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp bash-completion lib32readline-dev \
            libxml2 wget jq tree 2>&1 | tail -3
          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download vendor blobs
        run: |
          curl -sL -o blobs.tar.gz "https://github.com/rockinJ/android_device_oppo_findx3/releases/download/blobs-14.0.0.2301/blobs.tar.gz"
          mkdir -p blobs
          tar xzf blobs.tar.gz -C blobs
          ls blobs/

      - name: Init repo
        run: |
          mkdir -p android
          cd android
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.0 --git-lfs --depth=1 2>&1 | tail -3
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/roomservice.xml <<'EOF'
          <manifest>
            <project path="device/oppo/findx3" name="rockinJ/android_device_oppo_findx3" remote="github" revision="lineage-23.0" />
            <project path="kernel/oppo/sm8250" name="oppo-source/android_kernel_oppo_sm8250" remote="github" revision="oppo/sm8250_u_14.0.0_oppo_find_x3" />
            <project path="hardware/oplus" name="LineageOS/android_hardware_oplus" remote="github" revision="lineage-23.0" />
            <!-- Trim: emulator/car devices, other-vendor hardware, docs (disk space) -->
            <remove-project name="device/generic/arm64" />
            <remove-project name="device/generic/armv7-a-neon" />
            <remove-project name="device/generic/art" />
            <remove-project name="device/generic/car" />
            <remove-project name="LineageOS/android_device_generic_common" />
            <remove-project name="LineageOS/android_device_generic_goldfish" />
            <remove-project name="device/generic/goldfish-opengl" />
            <remove-project name="device/generic/trusty" />
            <remove-project name="device/generic/x86" />
            <remove-project name="device/generic/x86_64" />
            <remove-project name="device/google_car" />
            <remove-project name="LineageOS/android_device_google_atv" />
            <remove-project name="LineageOS/android_device_google_contexthub" />
            <remove-project name="device/google/cuttlefish" />
            <remove-project name="device/google/cuttlefish_prebuilts" />
            <remove-project name="device/google/cuttlefish_vmm" />
            <remove-project name="device/google/trout" />
            <remove-project name="device/sample" />
            <remove-project name="LineageOS/android_hardware_broadcom_libbt" />
            <remove-project name="platform/hardware/broadcom/wlan" />
            <remove-project name="platform/hardware/nxp/keymint" />
            <remove-project name="LineageOS/android_hardware_nxp_nfc" />
            <remove-project name="platform/hardware/nxp/secure_element" />
            <remove-project name="platform/hardware/nxp/uwb" />
            <remove-project name="platform/hardware/nxp/weaver" />
            <remove-project name="LineageOS/android_hardware_samsung_nfc" />
            <remove-project name="LineageOS/android_hardware_st_nfc" />
            <remove-project name="platform/hardware/st/secure_element" />
            <remove-project name="platform/hardware/st/secure_element2" />
            <remove-project name="platform/hardware/synaptics/wlan" />
            <remove-project name="platform/hardware/ti/am57x" />
            <remove-project name="kernel/tests" />
            <remove-project name="LineageOS/android_vendor_crowdin" />
            <remove-project name="LineageOS/android_hardware_knowles_athletico_sound_trigger_hal" />
            <remove-project name="LineageOS/android_vendor_codeaurora_telephony" />
            <remove-project name="LineageOS/charter" />
            <remove-project name="LineageOS/cm_crowdin" />
            <remove-project name="LineageOS/hudson" />
            <remove-project name="LineageOS/mirror" />
            <remove-project name="LineageOS/www" />
            <remove-project name="LineageOS/lineage_wiki" />
            <remove-project name="LineageOS/contributors-cloud-generator" />
            <remove-project name="LineageOS/scripts" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd android
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle 2>&1 | tail -5
          df -h / | tail -1

      - name: Trim .repo (free disk space for build)
        run: |
          cd android
          rm -rf .repo
          df -h / | tail -1

      - name: Extract vendor blobs
        run: |
          cd android
          export PYTHONPATH="$PWD/tools/extract-utils"
          cd device/oppo/findx3
          python3 extract-files.py ../../../../blobs 2>&1 | tail -20
          ls ../../../../vendor/oppo/findx3/ 2>/dev/null || echo "WARN: vendor dir missing"

      - name: Build
        run: |
          cd android
          source build/envsetup.sh
          lunch lineage_findx3-userdebug
          mka bacon -j$(nproc --all) 2>&1 | tail -40

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-23-findx3
          path: |
            android/out/target/product/findx3/*.zip
            android/out/target/product/findx3/*.img
          retention-days: 14
